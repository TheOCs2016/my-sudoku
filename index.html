<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    
    <link rel="manifest" href='data:application/manifest+json;utf8,{"name":"Pro Sudoku","short_name":"Sudoku","display":"standalone","start_url":".","scope":".","background_color":"#ffffff","theme_color":"#ffffff"}'>
    <link rel="icon" type="favicon/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <title>My Sudoku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="sudoku_bank.js"></script>
    
    <style>
        :root { --app-height: 100dvh; }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.2s ease-out, transform 0.2s ease-out, visibility 0.2s;
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            visibility: visible;
        }
        
        .fade-enter {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.2s ease-out, visibility 0.2s;
        }
        .fade-enter-active {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        .board-container {
            width: 100%;
            max-width: min(100%, calc(var(--app-height) - 340px)); 
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            position: relative;
        }

        .board-outer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px; 
            background-color: #9c9c9c; 
            border: 3px solid #171717; 
            padding: 0; 
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .board-inner {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1.2px; 
            background-color: #a89e9e;
            min-width: 0;
            min-height: 0;
        }

        .sudoku-cell {
            background-color: #ffffff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.1s;
            overflow: hidden;
            min-width: 0;
            min-height: 0;
        }

        .sudoku-cell.prefilled-bg { background-color: #dedcdc; }

        .cell-color-purple { background-color: #d8b4fe !important; }
        .cell-color-green { background-color: #86efac !important; }
        .cell-color-yellow { background-color: #fde047 !important; }

        .sudoku-cell::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: transparent;
            pointer-events: none;
            z-index: 1;
            transition: background-color 0.1s, box-shadow 0.1s;
        }

        /* Highlight Styles */
        .sudoku-cell.highlight-area::before { 
            background-color: rgba(245, 187, 11, 0.3); 
        }
        
        .sudoku-cell.selected::before { 
            background-color: rgba(245, 187, 11, 0.8) !important; 
        }
        
        /* Identical highlight (No vignette, lock OFF) */
        .sudoku-cell.highlight-identical::before { 
            background-color: rgba(245, 168, 11, 0.8) !important; 
        }
        
        /* Identical highlight (Strong vignette, lock ON) */
        .sudoku-cell.highlight-identical-locked::before { 
            background-color: rgba(245, 158, 11, 0.9) !important; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5) !important;
        }

        .sudoku-cell.highlight-identical .cell-value,
        .sudoku-cell.highlight-identical-locked .cell-value { color: #0f172a !important; }

        .sudoku-cell.conflict::before { background-color: rgba(220, 38, 38, 0.75) !important; box-shadow: none; }
        .sudoku-cell.conflict .cell-value { color: #ffffff !important; }

        .cell-value {
            font-size: clamp(16px, 6.5cqi, 32px);
            font-weight: 1000;
            z-index: 2;
            transition: color 0.1s, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cell-value.prefilled { color: #0f172a; }
        .cell-value.user-input { color: #0f172a; }

        .notes-grid {
            position: absolute;
            inset: 2px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            pointer-events: none;
            z-index: 2; 
        }

        .note-num {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(8px, 2.5cqi, 14px);
            color: #64748b; 
            font-weight: 500;
            line-height: 1;
            transition: color 0.1s, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .note-num.highlight-identical {
            color: #ffffff;
            background-color: #dc8e09;
            border-radius: 10%;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: auto;
            font-weight: 800;
            box-shadow: none; 
        }

        .locked-mode {
            color: #b91c1c;
            font-weight: 700;
            position: relative;
            background-color: #fee2e2;
            border-radius: 8px;
        }

        .color-locked {
            border-color: #1e293b !important;
            transform: scale(1.1);
        }

        .toggle-active {
            color: #b91c1c !important;
            background-color: #fee2e2;
        }
        
        .numpad-btn {
            transition: transform 0.1s, opacity 0.1s;
            touch-action: none;
        }
        .numpad-btn.exhausted { opacity: 0.25; pointer-events: none; }
        .numpad-btn:active { transform: scale(0.85); opacity: 0.7; }

        .numpad-val {
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ctrl-btn:active, .btn-color:active { transform: scale(0.9); }

        ::-webkit-scrollbar { display: none; }

        @media screen and (orientation: landscape) {
            :root { --app-height: 100dvw; }
            #app-wrapper {
                position: absolute; top: 0; left: 0; width: 100dvh; height: 100dvw;
                transform-origin: top left; transform: translateY(100dvh) rotate(-90deg);
                overflow: hidden;
            }
            .cell-value, .note-num, .numpad-val { transform: rotate(90deg); }
        }
    </style>
</head>

    <script>
        class SudokuGenerator {
            constructor() { this.N = 9; this.SRN = 3; }
            generate(K) {
                this.mat = Array.from({length: this.N}, () => Array(this.N).fill(0));
                this.fillValues();
                let solution = this.mat.map(row => [...row]);
                this.removeKDigits(K);
                return { puzzle: this.mat, solution: solution };
            }
            fillValues() { this.fillDiagonal(); this.fillRemaining(0, this.SRN); }
            fillDiagonal() { for (let i = 0; i < this.N; i = i + this.SRN) this.fillBox(i, i); }
            unUsedInBox(rowStart, colStart, num) {
                for (let i = 0; i < this.SRN; i++) {
                    for (let j = 0; j < this.SRN; j++) {
                        if (this.mat[rowStart + i][colStart + j] === num) return false;
                    }
                }
                return true;
            }
            fillBox(rowStart, colStart) {
                let num;
                for (let i = 0; i < this.SRN; i++) {
                    for (let j = 0; j < this.SRN; j++) {
                        do { num = Math.floor(Math.random() * this.N + 1);
                        } while (!this.unUsedInBox(rowStart, colStart, num));
                        this.mat[rowStart + i][colStart + j] = num;
                    }
                }
            }
            checkIfSafe(i, j, num) {
                return (this.unUsedInRow(i, num) && this.unUsedInCol(j, num) && this.unUsedInBox(i - (i % this.SRN), j - (j % this.SRN), num));
            }
            unUsedInRow(i, num) {
                for (let j = 0; j < this.N; j++) if (this.mat[i][j] === num) return false;
                return true;
            }
            unUsedInCol(j, num) {
                for (let i = 0; i < this.N; i++) if (this.mat[i][j] === num) return false;
                return true;
            }
            fillRemaining(i, j) {
                if (j >= this.N && i < this.N - 1) { i = i + 1; j = 0; }
                if (i >= this.N && j >= this.N) return true;
                if (i < this.SRN) { if (j < this.SRN) j = this.SRN; }
                else if (i < this.N - this.SRN) { if (j === Math.floor(i / this.SRN) * this.SRN) j = j + this.SRN; }
                else { if (j === this.N - this.SRN) { i = i + 1; j = 0; if (i >= this.N) return true; } }

                for (let num = 1; num <= this.N; num++) {
                    if (this.checkIfSafe(i, j, num)) {
                        this.mat[i][j] = num;
                        if (this.fillRemaining(i, j + 1)) return true;
                        this.mat[i][j] = 0;
                    }
                }
                return false;
            }
            countSolutions(grid, count) {
                let row = -1, col = -1, isEmpty = false;
                for(let i=0; i<9; i++) {
                    for(let j=0; j<9; j++) {
                        if(grid[i][j] === 0) { row = i; col = j; isEmpty = true; break; }
                    }
                    if(isEmpty) break;
                }
                if(!isEmpty) return count + 1;
                for(let num=1; num<=9; num++) {
                    if(this.isSafeForSolver(grid, row, col, num)) {
                        grid[row][col] = num;
                        count = this.countSolutions(grid, count);
                        grid[row][col] = 0;
                        if(count > 1) return count; 
                    }
                }
                return count;
            }
            isSafeForSolver(grid, row, col, num) {
                for(let x=0; x<9; x++) if(grid[row][x] === num) return false;
                for(let x=0; x<9; x++) if(grid[x][col] === num) return false;
                let startRow = row - row % 3, startCol = col - col % 3;
                for(let i=0; i<3; i++) {
                    for(let j=0; j<3; j++) {
                        if(grid[i + startRow][j + startCol] === num) return false;
                    }
                }
                return true;
            }
            solveGrid(grid) {
                let row = -1, col = -1, isEmpty = false;
                for(let i=0; i<9; i++) {
                    for(let j=0; j<9; j++) {
                        if(grid[i][j] === 0) { row = i; col = j; isEmpty = true; break; }
                    }
                    if(isEmpty) break;
                }
                if(!isEmpty) return true;
                for(let num=1; num<=9; num++) {
                    if(this.isSafeForSolver(grid, row, col, num)) {
                        grid[row][col] = num;
                        if(this.solveGrid(grid)) return true;
                        grid[row][col] = 0;
                    }
                }
                return false;
            }
            removeKDigits(K) {
                let positions = [];
                for(let i=0; i<81; i++) positions.push(i);
                for(let i=positions.length-1; i>0; i--) {
                    const j = Math.floor(Math.random() * (i+1));
                    [positions[i], positions[j]] = [positions[j], positions[i]];
                }
                let removed = 0;
                for(let i=0; i<81 && removed < K; i++) {
                    let cellId = positions[i];
                    let r = Math.floor(cellId / 9);
                    let c = cellId % 9;
                    if (this.mat[r][c] !== 0) {
                        let backup = this.mat[r][c];
                        this.mat[r][c] = 0;
                        let copy = this.mat.map(row => [...row]);
                        if (this.countSolutions(copy, 0) !== 1) this.mat[r][c] = backup; 
                        else removed++;
                    }
                }
            }
        }

        const State = {

        function loadTopTimes() {
            try {
                const saved = localStorage.getItem('sudoku_top_times_oc');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    Object.keys(State.topTimes).forEach(k => { if (parsed[k]) State.topTimes[k] = parsed[k]; });
                }
            } catch(e){}
        }

        function saveTopTimes() {
            try { localStorage.setItem('sudoku_top_times_oc', JSON.stringify(State.topTimes)); } catch(e){}
        }

        function saveGameState() {
            if (State.isWon) { localStorage.removeItem(SAVE_KEY); return; }
            let currentTime = State.accumulatedTime;
            if (!State.isPaused && State.lastStartTime) currentTime += (Date.now() - State.lastStartTime);
            
            const saveData = {
                diff: State.diff, isCustom: State.isCustom, grid: State.grid, solution: State.solution,
                history: State.history, future: State.future, accumulatedTime: currentTime,
                notesMode: State.notesMode, currentBankRating: State.currentBankRating
            };
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch(e) {}
        }

        function loadGameState() {
            try { const saved = localStorage.getItem(SAVE_KEY); if (saved) return JSON.parse(saved); } catch(e) {}
            return null;
        }

        function restoreGameState(data) {
            State.diff = data.diff; State.isCustom = data.isCustom || false; State.grid = data.grid; State.solution = data.solution;
            State.history = data.history || []; State.future = data.future || [];
            State.accumulatedTime = data.accumulatedTime || 0;
            State.notesMode = data.notesMode || false; State.currentBankRating = data.currentBankRating || null;
            
            State.selected = null; State.isWon = false; State.isPaused = true; 
            State.lockedNumber = null; State.showAreaHighlight = true;
            
            UI.btnNotes.classList.toggle('toggle-active', State.notesMode);
            UI.settingsModal.classList.remove('modal-enter-active');
            UI.winModal.classList.remove('modal-enter-active');
            
            updateHeaderUI();
            State.lastStartTime = Date.now();
            clearInterval(State.timerInterval);
            UI.timer.textContent = formatTime(State.accumulatedTime);
            
            document.getElementById('pause-overlay').style.display = 'flex';
            UI.btnPauseH1.innerHTML = '<i class="fas fa-play text-xl"></i>';
            renderBoard();
        }

        function init() {
            loadTopTimes();
            buildBoardDOM();
            buildKeypadDOM();
            setupEventListeners();
            const savedState = loadGameState();
            if (savedState) restoreGameState(savedState);
            else startNewGame();
        }

        function buildBoardDOM() {
            UI.board.innerHTML = '';
            UI.cells = Array.from({length: 9}, () => Array(9).fill(null));
            for (let br = 0; br < 3; br++) {
                for (let bc = 0; bc < 3; bc++) {
                    const block = document.createElement('div');
                    block.className = 'board-inner';
                    for (let cr = 0; cr < 3; cr++) {
                        for (let cc = 0; cc < 3; cc++) {
                            const r = br * 3 + cr, c = bc * 3 + cc;
                            const cell = document.createElement('div');
                            cell.className = 'sudoku-cell';
                            cell.dataset.r = r; cell.dataset.c = c;

                            const valSpan = document.createElement('span');
                            valSpan.className = 'cell-value';
                            cell.appendChild(valSpan);

                            const notesGrid = document.createElement('div');
                            notesGrid.className = 'notes-grid';
                            for (let n = 1; n <= 9; n++) {
                                const noteSpan = document.createElement('span');
                                noteSpan.className = 'note-num'; noteSpan.dataset.n = n;
                                notesGrid.appendChild(noteSpan);
                            }
                            cell.appendChild(notesGrid);
                            block.appendChild(cell);
                            UI.cells[r][c] = { root: cell, valEl: valSpan, notesEl: notesGrid };
                        }
                    }
                    UI.board.appendChild(block);
                }
            }
        }

        function buildKeypadDOM() {
            UI.keypad.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'numpad-btn text-3xl sm:text-[40px] text-slate-700 font-medium w-10 sm:w-12 h-14 flex items-center justify-center';
                btn.dataset.val = i;
                const span = document.createElement('span');
                span.className = 'numpad-val pointer-events-none'; span.textContent = i;
                btn.appendChild(span); UI.keypad.appendChild(btn);
            }
        }

        function stringToGrid(str) {
            let grid = [];
            for (let i = 0; i < 9; i++) {
                let row = [];
                for (let j = 0; j < 9; j++) row.push(parseInt(str[i * 9 + j], 10) || 0);
                grid.push(row);
            }
            return grid;
        }

        function startNewGame(customGridStr = null) {
	    State.isCustom = !!(customGridStr && customGridStr.length === 81);
            let data = null;
            State.currentBankRating = null;
            const gen = new SudokuGenerator();

            if (customGridStr && customGridStr.length === 81) {
                let puzzleGrid = stringToGrid(customGridStr);
                let solutionGrid = stringToGrid(customGridStr);
                gen.solveGrid(solutionGrid);
                data = { puzzle: puzzleGrid, solution: solutionGrid };
            } else if (window.SUDOKU_MASTER_BANK) {
                let tierKey = State.diff.charAt(0).toUpperCase() + State.diff.slice(1);
                if (tierKey === 'Extreme') tierKey = 'Expert'; 
                let bankTier;
                if (Array.isArray(window.SUDOKU_MASTER_BANK)) {
                    bankTier = window.SUDOKU_MASTER_BANK.filter(p => p.tier && p.tier.toLowerCase() === State.diff.toLowerCase());
                    if (!bankTier || bankTier.length === 0) bankTier = window.SUDOKU_MASTER_BANK[tierKey] || window.SUDOKU_MASTER_BANK['Extreme'] || window.SUDOKU_MASTER_BANK['Expert'];
                } else {
                    bankTier = window.SUDOKU_MASTER_BANK[tierKey] || window.SUDOKU_MASTER_BANK['Extreme'] || window.SUDOKU_MASTER_BANK['Expert'];
                }
                
                if (bankTier && bankTier.length > 0) {
                    const item = bankTier[Math.floor(Math.random() * bankTier.length)];
                    if (item.bankRating) State.currentBankRating = item.bankRating;
                    const puzzleStr = item.p || item.puzzle;
                    const solStr = item.s || item.solution;
                    let puzzleGrid = stringToGrid(puzzleStr);
                    let solutionGrid = (solStr && solStr.length === 81) ? stringToGrid(solStr) : stringToGrid(puzzleStr);
                    if(!solStr) gen.solveGrid(solutionGrid);
                    data = { puzzle: puzzleGrid, solution: solutionGrid };
                }
            }

            if (!data) data = gen.generate(difficulties[State.diff]);
            
            State.solution = data.solution;
            State.grid = [];
            for (let r = 0; r < 9; r++) {
                let row = [];
                for (let c = 0; c < 9; c++) {
                    const val = data.puzzle[r][c];
                    row.push({ val: val, initial: val !== 0, notes: Array(10).fill(false), color: null });
                }
                State.grid.push(row);
            }

            State.selected = null; State.history = []; State.future = []; State.isWon = false;
            if (State.isPaused) togglePause(); 
            
            UI.settingsModal.classList.remove('modal-enter-active');
            UI.winModal.classList.remove('modal-enter-active');
            UI.diffModal.classList.remove('fade-enter-active');
            UI.confirmModal.classList.remove('fade-enter-active');
            
            updateHeaderUI(); resetTimer(); renderBoard(); saveGameState();
        }

        function updateHeaderUI() {
            UI.diffDisplay.textContent = State.isCustom ? 'Custom' : State.diff.charAt(0).toUpperCase() + State.diff.slice(1);
            
            const colorMap = {
                easy: 'text-blue-600',
                medium: 'text-emerald-600',
                hard: 'text-amber-600',
                unfair: 'text-orange-600',
                extreme: 'text-red-600',
                custom: 'text-black-600'
            };
            const activeColor = State.isCustom ? colorMap.custom : colorMap[State.diff];
            UI.diffDisplay.className = `text-base sm:text-lg font-bold leading-tight ${activeColor}`;

            if (State.currentBankRating) {
                const nVal = Math.round(State.currentBankRating * 10);
                const mVal = TIER_M_VALUES[State.diff] || 99;
                UI.bankRatingDisplay.textContent = `${nVal} OF ${mVal}`;
                UI.bankRatingDisplay.classList.remove('hidden');
            } else { UI.bankRatingDisplay.classList.add('hidden'); }
            const times = State.topTimes[State.diff];
            UI.record.textContent = times.length > 0 ? formatTime(times[0]) : '--:--';
        }

        function resetTimer() {
            State.accumulatedTime = 0; State.lastStartTime = Date.now();
            clearInterval(State.timerInterval);
            State.timerInterval = setInterval(updateTimerDisplay, 1000);
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            if (State.isPaused || State.isWon) return;
            const ms = State.accumulatedTime + (Date.now() - State.lastStartTime);
            UI.timer.textContent = formatTime(ms);
        }

        function togglePause() {
            State.isPaused = !State.isPaused;
            const overlay = document.getElementById('pause-overlay');
            if (State.isPaused) {
                State.accumulatedTime += (Date.now() - State.lastStartTime);
                clearInterval(State.timerInterval);
                overlay.style.display = 'flex';
                UI.btnPauseH1.innerHTML = '<i class="fas fa-play text-xl"></i>';
            } else {
                State.lastStartTime = Date.now();
                State.timerInterval = setInterval(updateTimerDisplay, 1000);
                overlay.style.display = 'none';
                UI.btnPauseH1.innerHTML = '<i class="fas fa-pause text-xl"></i>';
            }
        }

        function executeReset() {
            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) {
                    const cell = State.grid[r][c];
                    if(!cell.initial) { cell.val = 0; cell.notes = Array(10).fill(false); }
                    cell.color = null;
                }
            }
            State.history = []; State.future = []; State.selected = null;
            if (State.isPaused) togglePause();
            resetTimer(); renderBoard();
            UI.confirmModal.classList.remove('fade-enter-active');
            saveGameState();
        }
        
        function executeClearNotes() {
            saveHistory();
            for(let r=0; r<9; r++) for(let c=0; c<9; c++) State.grid[r][c].notes = Array(10).fill(false);
            renderBoard(); UI.confirmModal.classList.remove('fade-enter-active'); saveGameState();
        }

        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = (totalSec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function getValidCandidates() {
            let validCands = Array.from({length: 9}, () => Array(9).fill(511));
            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) {
                    let v = State.grid[r][c].val;
                    if(v !== 0) {
                        for(let i=0; i<9; i++) {
                            validCands[r][i] &= ~(1<<(v-1)); validCands[i][c] &= ~(1<<(v-1));
                        }
                        let br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
                        for(let i=0; i<3; i++) for(let j=0; j<3; j++) validCands[br+i][bc+j] &= ~(1<<(v-1));
                    }
                }
            }
            return validCands;
        }

        function renderBoard() {
            const conflicts = getConflicts();
            let highlightVal = State.lockedNumber !== null ? State.lockedNumber : 
                              (State.selected && UI.toggles.ident.checked ? State.grid[State.selected.r][State.selected.c].val : null);
            if(highlightVal === 0) highlightVal = null;

            let counts = Array(10).fill(0);
            let showCands = UI.toggleCandidates.checked;
            let validCands = showCands ? getValidCandidates() : null;
            
            // Show area highlight even in notes mode
            let showArea = State.showAreaHighlight;

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const data = State.grid[r][c];
                    if (data.val !== 0) counts[data.val]++;
                    
                    const uiCell = UI.cells[r][c];
                    const root = uiCell.root;
                    
                    root.className = 'sudoku-cell';
                    if (data.initial) root.classList.add('prefilled-bg');
                    
                    if (State.showColors && data.color) {
                        if (data.color === 'purple') root.classList.add('cell-color-purple');
                        else if (data.color === 'green') root.classList.add('cell-color-green');
                        else if (data.color === 'yellow') root.classList.add('cell-color-yellow');
                    }
                    
                    if (data.val !== 0) {
                        uiCell.valEl.textContent = data.val;
                        uiCell.valEl.className = `cell-value ${data.initial ? 'prefilled' : 'user-input'}`;
                        uiCell.notesEl.style.display = 'none';
                    } else {
                        uiCell.valEl.textContent = '';
                        uiCell.notesEl.style.display = 'grid';
                        for (let i = 1; i <= 9; i++) {
                            const span = uiCell.notesEl.children[i-1];
                            let isNoteVisible = showCands ? (validCands[r][c] & (1<<(i-1))) !== 0 : data.notes[i];
                            span.textContent = isNoteVisible ? i : '';
                            
                            // Notes mode identical highlight mapping (No vignette applied to notes per CSS)
                            if (isNoteVisible && highlightVal === i && UI.toggles.ident.checked) span.classList.add('highlight-identical');
                            else span.classList.remove('highlight-identical');
                        }
                    }

                    if (State.selected) {
                        const isSameRow = r === State.selected.r;
                        const isSameCol = c === State.selected.c;
                        const isSameBox = Math.floor(r/3) === Math.floor(State.selected.r/3) && Math.floor(c/3) === Math.floor(State.selected.c/3);
                        
                        let areaHighlight = false;
                        if (showArea) {
                            if (UI.toggles.row.checked && isSameRow) areaHighlight = true;
                            if (UI.toggles.col.checked && isSameCol) areaHighlight = true;
                            if (UI.toggles.box.checked && isSameBox) areaHighlight = true;
                        }

                        if (areaHighlight) root.classList.add('highlight-area');
                        if (isSameRow && isSameCol) { root.classList.remove('highlight-area'); root.classList.add('selected'); }
                    }

                    // Identical answered numbers handling
                    if (highlightVal !== null && data.val === highlightVal) {
                        if (State.lockedNumber !== null) root.classList.add('highlight-identical-locked'); // Strong vignette
                        else root.classList.add('highlight-identical'); // No vignette
                    }

                    if (UI.toggles.conflict.checked && conflicts[r][c]) root.classList.add('conflict');
                }
            }

            document.querySelectorAll('.numpad-btn').forEach(btn => {
                const val = parseInt(btn.dataset.val);
                if (counts[val] >= 9) btn.classList.add('exhausted');
                else btn.classList.remove('exhausted');
            });
        }

        function getConflicts() {
            let conflicts = Array.from({length: 9}, () => Array(9).fill(false));
            if (!UI.toggles.conflict.checked) return conflicts;
            for(let r=0; r<9; r++) {
               for(let c=0; c<9; c++) {
                   const v = State.grid[r][c].val;
                   if (v === 0) continue;
                   for(let i=0; i<9; i++) {
                       if(i !== c && State.grid[r][i].val === v) { conflicts[r][c] = true; conflicts[r][i] = true; }
                       if(i !== r && State.grid[i][c].val === v) { conflicts[r][c] = true; conflicts[i][c] = true; }
                   }
                   let br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
                   for(let i=0; i<3; i++) {
                       for(let j=0; j<3; j++) {
                           let rr = br+i, cc = bc+j;
                           if ((rr !== r || cc !== c) && State.grid[rr][cc].val === v) { conflicts[r][c] = true; conflicts[rr][cc] = true; }
                       }
                   }
               }
            }
            return conflicts;
        }

        function saveHistory() { State.history.push(JSON.parse(JSON.stringify(State.grid))); State.future = []; }
        function getBoardCounts() {
            let counts = Array(10).fill(0);
            for(let r=0; r<9; r++) for(let c=0; c<9; c++) if(State.grid[r][c].val !== 0) counts[State.grid[r][c].val]++;
            return counts;
        }

        function setLock(val, fromKeypad = false) {
            State.lockedNumber = val;
            if (fromKeypad) { State.selected = null; State.showAreaHighlight = false; }
            document.querySelectorAll('.numpad-btn').forEach(k => k.classList.remove('locked-mode'));
            if (val !== null) {
                const btn = document.querySelector(`.numpad-btn[data-val="${val}"]`);
                if(btn) btn.classList.add('locked-mode');
            }
            renderBoard();
        }
        
        function setColorLock(color) {
            State.lockedColor = (State.lockedColor === color) ? null : color;
            UI.colorBtns.forEach(btn => {
                if(btn.dataset.color === State.lockedColor && color !== 'none') btn.classList.add('color-locked');
                else btn.classList.remove('color-locked');
            });
            if(color === 'none') State.lockedColor = null;
        }

        function handleCellClick(r, c) {
            if (State.isWon || State.isPaused) return;
            const cell = State.grid[r][c];

            // Color application via lock
            if (State.lockedColor !== null) {
                saveHistory();
                cell.color = (cell.color === State.lockedColor) ? null : State.lockedColor;
                renderBoard(); saveGameState(); return;
            }

            if (State.selected && State.selected.r === r && State.selected.c === c) {
                State.selected = null; renderBoard(); return;
            }

            State.selected = {r, c};
            State.showAreaHighlight = true; 

            if (State.lockedNumber !== null) {
                if (cell.val !== 0) {
                    if (cell.val !== State.lockedNumber) {
                        setLock(cell.val, false);
                    } else {
                        // Force the board to render so the area highlight becomes visible
                        renderBoard();
                    }
                } else {
                    applyInput(State.lockedNumber, r, c);
                }
                return;
            }
            renderBoard();
        }

        function applyInput(val, r = null, c = null) {
            if (State.isWon || State.isPaused) return;
            const targetR = r !== null ? r : (State.selected ? State.selected.r : null);
            const targetC = c !== null ? c : (State.selected ? State.selected.c : null);
            if (targetR === null || targetC === null) return;
            
            const cell = State.grid[targetR][targetC];
            if (cell.initial) return;

            saveHistory();

            if (val === 0) {
                setLock(null);
                if (cell.val !== 0) cell.val = 0; else cell.notes = Array(10).fill(false);
            } else {
                if (State.notesMode) {
                    if (cell.val === 0) cell.notes[val] = !cell.notes[val];
                } else {
                    cell.val = (cell.val === val) ? 0 : val; 
                    if (cell.val !== 0) {
                        for(let i=0; i<9; i++) {
                            State.grid[targetR][i].notes[val] = false; State.grid[i][targetC].notes[val] = false;
                        }
                        let br = Math.floor(targetR/3)*3, bc = Math.floor(targetC/3)*3;
                        for(let i=0; i<3; i++) for(let j=0; j<3; j++) State.grid[br+i][bc+j].notes[val] = false;

                        let counts = getBoardCounts();
                        if (counts[val] === 9 && State.lockedNumber === val) {
                            let nextVal = null;
                            for(let i=1; i<=9; i++) {
                                let testVal = ((val + i - 1) % 9) + 1;
                                if (counts[testVal] < 9) { nextVal = testVal; break; }
                            }
                            if (nextVal !== null) setLock(nextVal, true); else setLock(null);
                        }
                    } else { setLock(null); }
                }
            }
            renderBoard(); saveGameState(); checkWin();
        }

        function undo() {
            if (State.history.length === 0 || State.isWon || State.isPaused) return;
            State.future.push(JSON.parse(JSON.stringify(State.grid)));
            State.grid = State.history.pop();
            renderBoard(); saveGameState(); checkWin(); 
        }

        function redo() {
            if (State.future.length === 0 || State.isWon || State.isPaused) return;
            State.history.push(JSON.parse(JSON.stringify(State.grid)));
            State.grid = State.future.pop();
            renderBoard(); saveGameState(); checkWin();
        }

        function checkWin() {
            let isComplete = true;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (State.grid[r][c].val !== State.solution[r][c]) { isComplete = false; break; }
                }
                if(!isComplete) break;
            }
            if(isComplete && !State.isWon) handleWin();
        }

        async function playWinTune() {
            try {
                await window.Tone.start();
                const synth = new window.Tone.Synth().toDestination();
                const now = window.Tone.now();
                const notes = ["C5", "E5", "G5", "C6"];
                const durations = ["16n", "16n", "16n", "4n"];
                let time = now;
                for (let i = 0; i < notes.length; i++) {
                    synth.triggerAttackRelease(notes[i], durations[i], time);
                    time += window.Tone.Time(durations[i]).toSeconds();
                }
            } catch (e) { console.log('Audio disabled/failed:', e); }
        }

        function populateStatsModal() {
            UI.statsList.innerHTML = '';
            const labels = { easy: "Easy", medium: "Medium", hard: "Hard", unfair: "Unfair", extreme: "Extreme" };
            Object.keys(labels).forEach(diff => {
                const times = State.topTimes[diff] || [];
                const bestTime = times.length > 0 ? formatTime(times[0]) : '--:--';
                const row = document.createElement('div');
                row.className = "flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100";
                row.innerHTML = `<span class="font-bold text-slate-700">${labels[diff]}</span><span class="font-mono font-medium text-slate-600">${bestTime}</span>`;
                UI.statsList.appendChild(row);
            });
        }

        function handleWin() {
            State.isWon = true; clearInterval(State.timerInterval);
            const ms = State.accumulatedTime + (Date.now() - State.lastStartTime);

	    // Only save top times if it's NOT a custom puzzle
    	    if (!State.isCustom) {
        	const diffTimes = State.topTimes[State.diff];
        	diffTimes.push(ms); diffTimes.sort((a, b) => a - b);
        	if (diffTimes.length > 3) diffTimes.pop();
        	saveTopTimes(); 
  	    }
    
    	    saveGameState(); updateHeaderUI();
    
    	    // Update win screen text and colour
    	    UI.winDiff.textContent = State.isCustom ? 'Custom' : State.diff.charAt(0).toUpperCase() + State.diff.slice(1);
            
            const colorMap = {
                easy: 'text-blue-600',
                medium: 'text-emerald-600',
                hard: 'text-amber-600',
                unfair: 'text-orange-600',
                extreme: 'text-red-600',
                custom: 'text-black-600'
            };
            const activeColor = State.isCustom ? colorMap.custom : colorMap[State.diff];
            UI.winDiff.className = `font-bold ${activeColor}`;

    	    UI.winTime.textContent = formatTime(ms);
    	    UI.winModal.classList.add('modal-enter-active');
    	    playWinTune();
	}

        function setupEventListeners() {
            let confirmAction = 'reset';
            let pendingLoadState = null;
            
            UI.btnSettings.addEventListener('click', () => UI.settingsModal.classList.add('modal-enter-active'));
            UI.btnCloseSettings.addEventListener('click', () => { UI.settingsModal.classList.remove('modal-enter-active'); renderBoard(); });

            UI.btnStatsModal.addEventListener('click', () => { populateStatsModal(); UI.statsModal.classList.add('modal-enter-active'); });
            UI.closeStats.addEventListener('click', () => UI.statsModal.classList.remove('modal-enter-active'));

            UI.btnPauseH1.addEventListener('click', togglePause);
            UI.btnResumeOverlay.addEventListener('click', togglePause);
            UI.btnPauseNew.addEventListener('click', () => {
                UI.diffModal.classList.add('fade-enter-active');
            });
            
            UI.btnResetOverlay.addEventListener('click', () => {
                confirmAction = 'reset';
                document.getElementById('confirm-title').textContent = 'Reset Puzzle?';
                document.getElementById('confirm-desc').textContent = 'This will clear all your answers and notes, and reset the timer back to zero.';
                document.getElementById('btn-confirm-yes').textContent = 'Reset';
                UI.confirmModal.classList.add('fade-enter-active');
            });
            
            UI.btnConfirmCancel.addEventListener('click', () => UI.confirmModal.classList.remove('fade-enter-active'));
            UI.btnConfirmYes.addEventListener('click', () => {
                if (confirmAction === 'reset') executeReset();
                else if (confirmAction === 'clear_notes') executeClearNotes();
                else if (confirmAction === 'save_game') {
                    let saves = JSON.parse(localStorage.getItem('sudoku_saved_games') || '{}');
                    saves[State.diff] = loadGameState(); 
                    localStorage.setItem('sudoku_saved_games', JSON.stringify(saves));
                    UI.confirmModal.classList.remove('fade-enter-active');
                }
                else if (confirmAction === 'load_save') {
                    restoreGameState(pendingLoadState);
                    UI.confirmModal.classList.remove('fade-enter-active');
                }
                else if (confirmAction === 'import_data') {
                    UI.confirmModal.classList.remove('fade-enter-active');
                    UI.fileInput.click();
                }
            });

            UI.winDiffBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    State.diff = e.currentTarget.dataset.diff;
                    startNewGame();
                });
            });
            UI.btnDiffCancel.addEventListener('click', () => UI.diffModal.classList.remove('fade-enter-active'));

            Object.values(UI.toggles).forEach(toggle => toggle.addEventListener('change', renderBoard));
            UI.toggleCandidates.addEventListener('change', renderBoard);
            
            UI.btnToggleColors.addEventListener('click', () => {
                State.showColors = !State.showColors;
                UI.btnToggleColors.innerHTML = State.showColors ? '<i class="fas fa-eye text-lg"></i>' : '<i class="fas fa-eye-slash text-lg"></i>';
                renderBoard();
            });

            UI.colorBtns.forEach(btn => {
                let holdTimeout;
                let isHold = false;
                const color = btn.dataset.color;
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault(); isHold = false; btn.style.transform = 'scale(0.85)';
                    holdTimeout = setTimeout(() => {
                        isHold = true;
                        if (color !== 'none') {
                            saveHistory();
                            for(let r=0; r<9; r++) for(let c=0; c<9; c++) {
                                if(State.grid[r][c].color === color) State.grid[r][c].color = null;
                            }
                            renderBoard(); saveGameState();
                            if(navigator.vibrate) navigator.vibrate(50);
                        }
                    }, 400); 
                });
                btn.addEventListener('pointerup', (e) => {
                    e.preventDefault(); clearTimeout(holdTimeout); btn.style.transform = '';
                    if (!isHold) setColorLock(color);
                });
                btn.addEventListener('pointerleave', () => { clearTimeout(holdTimeout); btn.style.transform = ''; });
                btn.addEventListener('pointercancel', () => { clearTimeout(holdTimeout); btn.style.transform = ''; });
            });

            UI.btnCopyVals.addEventListener('click', () => {
                let str = "";
                for(let r=0; r<9; r++) for(let c=0; c<9; c++) str += State.grid[r][c].initial ? State.grid[r][c].val : "0";
                navigator.clipboard.writeText(str);
            });

            UI.btnCreatePuzzle.addEventListener('click', () => {
                const str = prompt("Paste an 81-character puzzle string (use 0 for empty cells):");
                if (str && str.length === 81) startNewGame(str);
            });

            UI.btnSaveGame.addEventListener('click', () => {
                let saves = JSON.parse(localStorage.getItem('sudoku_saved_games') || '{}');
                if (saves[State.diff] && !State.isCustom) {
                    confirmAction = 'save_game';
                    document.getElementById('confirm-title').textContent = 'Overwrite Save?';
                    document.getElementById('confirm-desc').textContent = `You already have a saved game for ${State.diff}. Saving will overwrite it.`;
                    document.getElementById('btn-confirm-yes').textContent = 'Overwrite';
                    UI.settingsModal.classList.remove('modal-enter-active');
                    UI.confirmModal.classList.add('fade-enter-active');
                } else if (!State.isCustom) {
                    saves[State.diff] = loadGameState();
                    localStorage.setItem('sudoku_saved_games', JSON.stringify(saves));
                }
            });

            UI.btnLoadGame.addEventListener('click', () => {
                UI.loadGameList.innerHTML = '';
                const saves = JSON.parse(localStorage.getItem('sudoku_saved_games') || '{}');
                const labels = { easy: "Easy", medium: "Medium", hard: "Hard", unfair: "Unfair", extreme: "Extreme" };
                let hasSaves = false;

                Object.keys(labels).forEach(diff => {
                    if (saves[diff]) {
                        hasSaves = true;
                        const btn = document.createElement('button');
                        btn.className = "w-full bg-slate-100 text-slate-700 font-bold py-3.5 rounded-xl active:bg-slate-200 transition-colors flex justify-between px-6 items-center";
                        let timeStr = formatTime(saves[diff].accumulatedTime || 0);
                        btn.innerHTML = `<span>${labels[diff]}</span> <span class="font-mono font-medium text-slate-500">${timeStr}</span>`;
                        
                        btn.addEventListener('click', () => {
                            pendingLoadState = saves[diff];
                            confirmAction = 'load_save';
                            document.getElementById('confirm-title').textContent = 'Load Saved Game?';
                            document.getElementById('confirm-desc').textContent = 'Your current puzzle progress will be lost.';
                            document.getElementById('btn-confirm-yes').textContent = 'Load';
                            UI.loadGameModal.classList.remove('modal-enter-active');
                            UI.settingsModal.classList.remove('modal-enter-active');
                            UI.confirmModal.classList.add('fade-enter-active');
                        });
                        UI.loadGameList.appendChild(btn);
                    }
                });

		if (!hasSaves) {
  		      UI.loadGameList.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">No saved games found.</p>';
  		}	   
                                
		UI.settingsModal.classList.remove('modal-enter-active');                
		UI.loadGameModal.classList.add('modal-enter-active');
            });

            UI.closeLoadGame.addEventListener('click', () => {
                UI.loadGameModal.classList.remove('modal-enter-active');
            });

            UI.btnExportData.addEventListener('click', () => {
                const data = {
                    topTimes: State.topTimes,
                    savedGames: JSON.parse(localStorage.getItem('sudoku_saved_games') || '{}'),
                    currentState: loadGameState()
                };
                const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'sudoku_backup.json';
                a.click(); URL.revokeObjectURL(url);
            });

            UI.btnImportData.addEventListener('click', () => {
                confirmAction = 'import_data';
                document.getElementById('confirm-title').textContent = 'Import Data?';
                document.getElementById('confirm-desc').textContent = 'Your current progress and stats may be overwritten by the loaded file.';
                document.getElementById('btn-confirm-yes').textContent = 'Import';
                UI.settingsModal.classList.remove('modal-enter-active');
                UI.confirmModal.classList.add('fade-enter-active');
            });

            UI.fileInput.addEventListener('change', (e) => {
                if(!e.target.files.length) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if(data.topTimes) { State.topTimes = data.topTimes; saveTopTimes(); }
                        if(data.savedGames) localStorage.setItem('sudoku_saved_games', JSON.stringify(data.savedGames));
                        if(data.currentState) localStorage.setItem(SAVE_KEY, JSON.stringify(data.currentState));
                        location.reload(); 
                    } catch(err) { alert("Invalid backup file."); }
                };
                reader.readAsText(e.target.files[0]);
            });
            
            UI.btnWinNew.addEventListener('click', () => {
                UI.winModal.classList.remove('modal-enter-active');
                UI.diffModal.classList.add('fade-enter-active');
            });
            UI.btnWinClose.addEventListener('click', () => UI.winModal.classList.remove('modal-enter-active'));

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (!State.isPaused && !State.isWon) togglePause();
                    saveGameState();
                }
            });
            window.addEventListener('beforeunload', saveGameState);

            UI.btnUndo.addEventListener('click', undo);
            UI.btnRedo.addEventListener('click', redo);
            UI.btnErase.addEventListener('click', () => applyInput(0));
            
            let notesHoldTimeout; let isNotesHold = false;
            UI.btnNotes.addEventListener('pointerdown', (e) => {
                e.preventDefault(); isNotesHold = false; UI.btnNotes.style.transform = 'scale(0.9)';
                notesHoldTimeout = setTimeout(() => {
                    isNotesHold = true; if(navigator.vibrate) navigator.vibrate(50);
                    confirmAction = 'clear_notes';
                    document.getElementById('confirm-title').textContent = 'Clear All Notes?';
                    document.getElementById('confirm-desc').textContent = 'This will safely remove all candidate numbers from the entire board.';
                    document.getElementById('btn-confirm-yes').textContent = 'Clear Notes';
                    UI.confirmModal.classList.add('fade-enter-active');
                }, 400); 
            });
            UI.btnNotes.addEventListener('pointerup', (e) => {
                e.preventDefault(); clearTimeout(notesHoldTimeout); UI.btnNotes.style.transform = '';
                if (!isNotesHold) {
                    State.notesMode = !State.notesMode;
                    UI.btnNotes.classList.toggle('toggle-active', State.notesMode);
                    renderBoard();
                }
            });
            UI.btnNotes.addEventListener('pointerleave', () => { clearTimeout(notesHoldTimeout); UI.btnNotes.style.transform = ''; });
            UI.btnNotes.addEventListener('pointercancel', () => { clearTimeout(notesHoldTimeout); UI.btnNotes.style.transform = ''; });

            UI.board.addEventListener('pointerdown', (e) => {
                const cell = e.target.closest('.sudoku-cell');
                if (cell) { e.preventDefault(); handleCellClick(parseInt(cell.dataset.r), parseInt(cell.dataset.c)); }
            });

            UI.keypad.querySelectorAll('.numpad-btn').forEach(btn => {
                let holdTimeout; let isHold = false; const val = parseInt(btn.dataset.val);
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault(); isHold = false; btn.style.transform = 'scale(0.85)';
                    holdTimeout = setTimeout(() => {
                        isHold = true;
                        if (State.lockedNumber === val) setLock(null);
                        else { setLock(val, true); if(navigator.vibrate) navigator.vibrate(50); }
                    }, 400); 
                });
                btn.addEventListener('pointerup', (e) => {
                    e.preventDefault(); clearTimeout(holdTimeout); btn.style.transform = '';
                    if (!isHold) {
                        if (State.lockedNumber === val) setLock(null);
                        else if (State.lockedNumber !== null && State.lockedNumber !== val) setLock(val, true);
                        else applyInput(val);
                    }
                });
                btn.addEventListener('pointerleave', () => { clearTimeout(holdTimeout); btn.style.transform = ''; });
                btn.addEventListener('pointercancel', () => { clearTimeout(holdTimeout); btn.style.transform = ''; });
            });

            document.addEventListener('keydown', (e) => {
                if (State.isWon || State.isPaused) return;
                if (e.key === 'y' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); redo(); }
                else if (e.key === 'z' && (e.ctrlKey || e.metaKey) && e.shiftKey) { e.preventDefault(); redo(); }
                else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
                else if (e.key >= '1' && e.key <= '9') applyInput(parseInt(e.key));
                else if (e.key === 'Backspace' || e.key === 'Delete') applyInput(0);
                else if (e.key === 'n') {
                    State.notesMode = !State.notesMode;
                    UI.btnNotes.classList.toggle('toggle-active', State.notesMode);
                    renderBoard();
                }
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
